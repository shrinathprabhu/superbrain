<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.34 0.5 96 96" role="img" aria-label="Superbrain">
  <defs>
    <linearGradient id="sb-body" x1="30" y1="22" x2="70" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6c6ff"/>
      <stop offset="1" stop-color="#5180ea"/>
    </linearGradient>
    <linearGradient id="sb-fin" x1="10" y1="16" x2="60" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f99f0"/>
      <stop offset="1" stop-color="#3a62c8"/>
    </linearGradient>
    <!-- The silhouette, reused as a clip so the belly can never spill past it. -->
    <path id="sb-shape" d="M93 51
      C 86 45 77 41 68 39
      C 58 31 44 28 33 34
      C 26 38 21 46 18 54
      C 24 65 39 72 54 70
      C 67 68 79 62 86 56
      C 90 54 92 52 93 51 Z"/>
    <clipPath id="sb-clip"><use href="#sb-shape"/></clipPath>
  </defs>

  <!-- tail, behind the body -->
  <path d="M26 56 L5 43 C 1 52 3 61 9 66 Z" fill="url(#sb-fin)"/>
  <path d="M26 60 L9 77 C 18 79 25 72 29 65 Z" fill="url(#sb-fin)"/>
  <!-- backswept dorsal fin -->
  <path d="M39 32 C 40 21 44 15 49 13 C 51 21 53 28 57 32 Z" fill="url(#sb-fin)"/>

  <use href="#sb-shape" fill="url(#sb-body)"/>

  <!-- pale underside: everything below the belly line, clipped to the body -->
  <g clip-path="url(#sb-clip)">
    <path d="M12 44 C 22 57 37 63 54 61 C 68 59 81 53 94 46 L100 100 L0 100 Z"
          fill="#dbe8ff" opacity="0.97"/>
  </g>

  <!-- pectoral flipper, in front -->
  <use href="#sb-shape" fill="none" stroke="#3a62c8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M49 65 C 43 73 42 80 44 84 C 52 80 57 73 59 67 Z" fill="url(#sb-fin)"/>

  <!-- face -->
  <path d="M72 55 C 79 57 86 55 92 51" fill="none" stroke="#0e1017"
        stroke-opacity="0.5" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="69" cy="46" r="3.9" fill="#0e1017"/>
  <circle cx="70.3" cy="44.7" r="1.4" fill="#ffffff"/>
  <ellipse cx="59" cy="35" rx="2.1" ry="1.2" transform="rotate(-18 59 35)"
           fill="#0e1017" opacity="0.28"/>
</svg>
